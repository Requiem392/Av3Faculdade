<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clima Agora</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body onload="verificarLogin()">
    <div class="topo">
        <h1>Clima Agora</h1>
        <p class="mb-0">Consulte o clima atual de algumas cidades</p>
        <div id="bem-vindo" class="mt-2 text-white"></div>
    </div>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card app-card shadow-sm">
                    <div class="card-body p-4">
                        <label for="cidade" class="form-label">Escolha uma cidade:</label>
                        <select id="cidade" class="form-select mb-3">
                            <option value="fortaleza">Fortaleza</option>
                            <option value="juazeiro">Juazeiro do Norte</option>
                            <option value="sao-paulo">São Paulo</option>
                            <option value="rio">Rio de Janeiro</option>
                        </select>
                        <button class="btn btn-primary w-100" onclick="buscarClima()">
                            Buscar clima
                        </button>
                        <div id="resultado" class="mt-4">
                            <div class="text-center text-muted">
                                <p>Selecione uma cidade e clique no botão.</p>
                            </div>
                        </div>
                    </div>
                </div>
                <p class="text-center mt-3 rodape">
                    Clima Agora
                </p>
            </div>
        </div>
    </div>
    
    <!-- Scripts separados para manter a arquitetura limpa -->
    <script src="js/auth.js"></script>
    <script src="js/clima.js"></script>
</body>
</html>
