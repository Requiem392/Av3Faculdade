<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Clima Agora</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="topo">
        <h1>Clima Agora</h1>
        <p class="mb-0">Acesse sua conta</p>
    </div>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6 col-lg-5">
                <div class="card app-card shadow-sm">
                    <div class="card-body p-4">
                        <div id="mensagem" class="alert d-none"></div>
                        <form id="formLogin" onsubmit="fazerLogin(event)">
                            <div class="mb-3">
                                <label for="email" class="form-label">E-mail</label>
                                <input type="email" class="form-control" id="email" required>
                            </div>
                            <div class="mb-3">
                                <label for="senha" class="form-label">Senha</label>
                                <input type="password" class="form-control" id="senha" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Entrar</button>
                        </form>
                        <div class="text-center mt-3">
                            <a href="cadastro.html" class="text-decoration-none">Não tem conta? Cadastre-se</a>
                        </div>
                    </div>
                </div>
                <p class="text-center mt-3 rodape">
                    Clima Agora
                </p>
            </div>
        </div>
    </div>
    <script src="js/auth.js"></script>
</body>
</html>
